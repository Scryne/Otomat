version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule: { interval: "weekly" }
    # yerel modeller (TTS, hizalama, OCR) ayrı PR: biri bozulunca saf Python yükseltmeleri de onunla takılmasın
    groups:
      modeller:
        patterns: ["onnxruntime*", "kokoro-onnx", "faster-whisper", "ctranslate2", "rapidocr*", "tokenizers"]
      tum:
        patterns: ["*"]
    open-pull-requests-limit: 3
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups: { tum: { patterns: ["*"] } }
    open-pull-requests-limit: 3
