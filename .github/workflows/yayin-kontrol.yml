name: Yayın yolu kontrolü

# Elle: buffer modunun üç bağımlılığı Actions'ta çalışıyor mu (Buffer anahtarı + kanal, YouTube token'ı,
# otomat-site deploy key'i). Hiçbir şey yüklemez, yazmaz.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:  # yayındaki her kanalın token'ı (earth 10-23, uzay 10-18'de durdu; geri açılırsa buraya da eklenir)
        include:
          - { kanal: futbol, sir: "_SPOR" }  # Arena Lore: üç seri tek token, futbol profili yeter
    env:
      OTOMAT_KANAL: ${{ matrix.kanal }}
    # sırlar yalnız onları kullanan adımda (gunluk.yml gibi): checkout, setup-uv ve uv sync görmesin
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      # kanal kimliği profilde yazılı olduğu için kanal_id() anahtarı hiç sınamıyordu: hesap sorgusu anahtarı doğrular
      - name: Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          uv run python -c "from otomat.yayin import buffer; h = buffer.sorgu('query { account { organizations { id } } }'); print('buffer org:', len(h['account']['organizations']), 'kanal:', buffer.kanal_id())"
      - name: YouTube
        env:
          YT_ISTEMCI_JSON: ${{ secrets.YT_ISTEMCI_JSON }}
          KANAL_TOKEN: ${{ secrets[format('YT_TOKEN_JSON{0}', matrix.sir)] }}
        run: |
          export "YT_TOKEN_JSON${{ matrix.sir }}=$KANAL_TOKEN"
          uv run python -m otomat.yayin.youtube kontrol
      - name: Site deploy key
        env:
          OTOMAT_SITE_ANAHTAR: ${{ secrets.OTOMAT_SITE_ANAHTAR }}
        run: |
          umask 077
          printf '%s\n' "$OTOMAT_SITE_ANAHTAR" > /tmp/site_anahtar
          export GIT_SSH_COMMAND="ssh -i /tmp/site_anahtar -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --depth 1 git@github.com:Scryne/otomat-site.git /tmp/site
          # dry-run receive-pack'e bağlanır: salt okunur anahtar burada reddedilir, hiçbir şey yazılmaz
          git -C /tmp/site push --dry-run origin HEAD:refs/heads/yazma-kontrolu
