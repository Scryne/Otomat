name: Günlük üretim

# Her gün bir video: analitik → hikâye havuzu → haydut seçimi → senaryo + hakem (Cloudflare) → sahne görselleri → ses →
# render → çeviri (Ollama) → yayın (buffer/api)
# ya da teslim paketi (Plan B; buffer düşerse de). Pazartesi geçen haftanın raporu. Sorun olursa "alarm" etiketli issue (Scryne'a bildirim).
# GitHub planlı koşuları saatlerce geciktirip bazen hiç başlatmıyor (2026-10-05, 2026-10-09): ikinci cron yedektir.
# buffer/api modunda kanal birkaç günlük planlı video stoğu (pist, durum.PIST_GUN) tutar; pist doluysa koşu
# "Üretilecek iş var mı" adımında biter (teslim modunda: gün zaten üretildiyse).
# Çok kanal: her kanal ayrı matris işi (kanallar/<id>/kanal.toml); biri düşerse diğerleri sürer, alarm kanal başına.
# Matristeki kanal yayına hazırdır (token + Buffer bağlantısı); hazırlıktaki kanal buraya eklenmez (test_kanal.py).
on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "47 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # sir: token secret eki (YT_TOKEN_JSON<sir>); etiket: Plan B Release öneki; ollama: yerel LLM gerekir mi
        # (veri motoru evet; hikâye motoru metni ve çeviriyi Cloudflare'de yapar)
        include:
          - { kanal: earth, sir: "", etiket: teslim, ollama: false }
          - { kanal: uzay, sir: "_UZAY", etiket: teslim-uzay, ollama: false }
    concurrency:
      group: gunluk-${{ matrix.kanal }}
      cancel-in-progress: false
    env:
      OTOMAT_KANAL: ${{ matrix.kanal }}
      # kanal başına mod (OTOMAT_YAYIN_<id>); earth eski OTOMAT_YAYIN değişkenini de okur
      OTOMAT_YAYIN: ${{ vars[format('OTOMAT_YAYIN_{0}', matrix.kanal)] || (matrix.kanal == 'earth' && vars.OTOMAT_YAYIN) || 'teslim' }}
      YT_ISTEMCI_JSON: ${{ secrets.YT_ISTEMCI_JSON }}
      KANAL_TOKEN: ${{ secrets[format('YT_TOKEN_JSON{0}', matrix.sir)] }}
      # buffer modu (docs/arastirma/06): Buffer API + otomat-site deploy key (medya geçici olarak Pages'ta)
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      OTOMAT_SITE_ANAHTAR: ${{ secrets.OTOMAT_SITE_ANAHTAR }}
      # hikâye motoru (K-16): senaryo + sahne görselleri Cloudflare Workers AI bedava kotasıyla
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      # dalın o anki ucu: kuyrukta bekleyen koşu öncekinin durum commit'ini görsün
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Üretilecek iş var mı
        id: kontrol
        run: |
          if PYTHONPATH=. python3 -m otomat.durum; then
            echo "$OTOMAT_KANAL: pist dolu (ya da bugün zaten üretildi), koşu atlanıyor."
            echo "atla=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v7
        if: steps.kontrol.outputs.atla != '1'
        with:
          enable-cache: true
      - run: uv sync --locked --extra ses
        if: steps.kontrol.outputs.atla != '1'
      - name: Model önbelleği
        if: steps.kontrol.outputs.atla != '1'
        uses: actions/cache@v6
        with:
          path: |
            ~/.ollama/models
            modeller
          key: modeller-${{ hashFiles('config/modeller.toml') }}
      - name: Müzik önbelleği
        if: steps.kontrol.outputs.atla != '1'
        uses: actions/cache@v6
        with:
          path: modeller/muzik
          key: muzik-${{ hashFiles('kanallar/*/kanal.toml') }}
          restore-keys: muzik-
      - name: Ollama
        if: steps.kontrol.outputs.atla != '1' && matrix.ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          sleep 5
          ollama pull "$(grep -m1 '^model' config/modeller.toml | cut -d'"' -f2)"
      - name: Üret
        id: uret
        if: steps.kontrol.outputs.atla != '1'
        run: |
          export "YT_TOKEN_JSON${{ matrix.sir }}=$KANAL_TOKEN"
          uv run python -m otomat.gunluk
      - name: Teslim paketi (Plan B) → haftanın Release'i
        if: hashFiles('teslim/**') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ matrix.etiket }}-$(date -u +%G-H%V)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Teslim ${{ matrix.kanal }} $(date -u +%G) / hafta $(date -u +%V)" \
            --notes "Plan B: bu haftanın videoları."
          gh release upload "$TAG" teslim/* --clobber
          # haftanın tüm YUKLE.md'lerinden tek sayfa: sıra, TR yayın saati, kopyala-yapıştır blokları
          mkdir -p hafta
          gh release download "$TAG" -p "*_YUKLE.md" -D hafta --clobber
          uv run python -m otomat.yayin.hafta hafta "$TAG" > HAFTA.md
          gh release upload "$TAG" HAFTA.md --clobber
          gh release edit "$TAG" --notes "Plan B: bu haftanın videoları. Yüklerken yalnız HAFTA.md'yi aç: sıra, yayın saati (TR) ve yapıştırılacak metinler orada."
      - name: Durumu kaydet
        if: always() && steps.kontrol.outputs.atla != '1'
        run: |
          git config user.name "otomat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add durum/ raporlar/
          git diff --cached --quiet || git commit -m "Günlük koşu ($OTOMAT_KANAL): durum ve rapor ($(date -u +%F))"
          # diğer kanalların işleri aynı dala yazıyor; dosyalar ayrı olduğu için rebase çakışmaz
          for i in 1 2 3 4 5; do git push && break; git pull --rebase; sleep $((i * 5)); done
          git push  # beş denemede de gitmediyse adım düşsün
      - name: Alarm (issue)
        if: always() && steps.kontrol.outputs.atla != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SONUC: ${{ job.status }}
          KOSU: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SONUC" != "success" ] && [ ! -f calisma/alarm.md ]; then
            mkdir -p calisma
            printf 'Günlük koşu %s: iş adımı düştü (%s), Python alarm yazamadan.\n' "$(date -u +%F)" "$SONUC" > calisma/alarm.md
          fi
          gh label create alarm --color B60205 --description "Otomat günlük koşu alarmı" --force
          gh label create "kanal:$OTOMAT_KANAL" --color 1D76DB --description "Otomat kanalı" --force
          ACIK=$(gh issue list --label alarm --label "kanal:$OTOMAT_KANAL" --state open --json number --jq '.[0].number // empty')
          if [ -f calisma/alarm.md ]; then
            printf '\n[Koşu kaydı](%s) · @Scryne\n' "$KOSU" >> calisma/alarm.md
            if [ -n "$ACIK" ]; then gh issue comment "$ACIK" --body-file calisma/alarm.md
            else gh issue create --title "Otomat alarmı ($OTOMAT_KANAL)" --label alarm --label "kanal:$OTOMAT_KANAL" --body-file calisma/alarm.md; fi
          elif [ -n "$ACIK" ]; then
            gh issue close "$ACIK" --comment "Temiz koşu ($(date -u +%F)): alarm kapandı. $KOSU"
          fi
