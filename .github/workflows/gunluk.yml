name: Günlük üretim

# Her gün bir video: analitik → hikâye havuzu → haydut seçimi → senaryo + hakem (Cloudflare) → sahne görselleri → ses →
# render → çeviri (Cloudflare) → yayın (buffer/api) ya da teslim paketi (Plan B; buffer düşerse de). Pazartesi geçen
# haftanın raporu. Sorun olursa "alarm" etiketli issue (Scryne'a bildirim).
# GitHub planlı koşuları saatlerce geciktirip bazen hiç başlatmıyor (2026-10-05, 2026-10-09, 2026-10-13'te 06:17 koşusu
# 14:10'da başladı, 16:47 hiç gelmedi): diğer cron'lar yedektir. Pist doluysa koşu ilk adımda biter (~20 sn).
# 11:37 Earth'ün 14:00 yayınından, 21:37 kotanın kayan penceresi açıldıktan sonra telafi içindir.
# buffer/api modunda kanal birkaç günlük planlı video stoğu (pist, durum.PIST_GUN) tutar; pist doluysa koşu
# "Üretilecek iş var mı" adımında biter (teslim modunda: gün zaten üretildiyse).
# Çok kanal: her kanal ayrı matris işi (kanallar/<id>/kanal.toml); biri düşerse diğerleri sürer, alarm kanal başına.
# Matristeki kanal yayına hazırdır (token + Buffer bağlantısı); hazırlıktaki kanal buraya eklenmez (test_kanal.py).
on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "37 11 * * *"
    - cron: "47 16 * * *"
    - cron: "37 21 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  uret:
    # sürüm sabit: ubuntu-latest 2026-10-19'dan itibaren Ubuntu 26'ya geçiyor (ffmpeg/onnxruntime riski; 10-09'da
    # ffprobe eksikliği bir günü yaktı). Yükseltme bilinçli yapılır.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # sir: token secret eki (YT_TOKEN_JSON<sir>); etiket: Plan B Release öneki
        include:
          - { kanal: earth, sir: "", etiket: teslim }
          - { kanal: uzay, sir: "_UZAY", etiket: teslim-uzay }
    concurrency:
      group: gunluk-${{ matrix.kanal }}
      cancel-in-progress: false
    env:
      OTOMAT_KANAL: ${{ matrix.kanal }}
      # kanal başına mod (OTOMAT_YAYIN_<id>); earth eski OTOMAT_YAYIN değişkenini de okur
      OTOMAT_YAYIN: ${{ vars[format('OTOMAT_YAYIN_{0}', matrix.kanal)] || (matrix.kanal == 'earth' && vars.OTOMAT_YAYIN) || 'teslim' }}
    # sırlar yalnız onları kullanan adımda (Üret): checkout, cache, artifact ve gh adımlarına geçmesinler
    steps:
      # dalın o anki ucu: kuyrukta bekleyen koşu öncekinin durum commit'ini görsün
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Üretilecek iş var mı
        id: kontrol
        run: |
          if PYTHONPATH=. python3 -m otomat.durum; then
            echo "$OTOMAT_KANAL: pist dolu (ya da bugün zaten üretildi), koşu atlanıyor."
            echo "atla=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v7
        if: steps.kontrol.outputs.atla != '1'
        with:
          enable-cache: true
      - run: uv sync --locked --extra ses --extra gorsel
        if: steps.kontrol.outputs.atla != '1'
      - name: Model önbelleği
        if: steps.kontrol.outputs.atla != '1'
        uses: actions/cache@v6
        with:
          path: modeller
          key: modeller-${{ hashFiles('config/modeller.toml') }}
      - name: Müzik önbelleği
        if: steps.kontrol.outputs.atla != '1'
        uses: actions/cache@v6
        with:
          path: modeller/muzik
          key: muzik-${{ hashFiles('kanallar/*/kanal.toml') }}
          restore-keys: muzik-
      # kabulden geçip kanala çıkamamış üretimler (kota, ffprobe, Buffer) kota harcamadan yeniden kullanılır
      # (gunluk.hazir_uretim), kotaya takılıp yarım kalanın senaryosu ve görselleri sürdürülür (yarim_uretimi_getir);
      # yayınlanmış ya da reddedilmiş olanları taze süzgeci eler. Koşu başına ayrı klasör: aynı yoldaki dosyalar
      # birbirini ezmesin. Bu klasör artifact'a yeniden yüklenmez (artifact'lar her koşuda büyüyordu).
      - name: Önceki üretimler
        if: steps.kontrol.outputs.atla != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        # son 12 koşu (4 cron ≈ 3 gün = pist; T+2 videosunun klasörü yayınına kadar bulunsun: çeviri onarımı ve
        # planlama onarımı ona bakar); yeniden denenen koşunun artifact'ı ayrı adlı
        run: |
          for id in $(gh run list --workflow gunluk.yml -L 12 --json databaseId --jq '.[].databaseId'); do
            for ad in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                --jq ".artifacts[] | select(.expired | not) | .name | select(startswith(\"uretim-$OTOMAT_KANAL-\"))"); do
              gh run download "$id" -n "$ad" -D "calisma/onceki/$ad" 2>/dev/null || true
            done
          done
          ls calisma/onceki 2>/dev/null || echo "önceki üretim yok"
      - name: Üret
        id: uret
        if: steps.kontrol.outputs.atla != '1'
        env:
          YT_ISTEMCI_JSON: ${{ secrets.YT_ISTEMCI_JSON }}
          KANAL_TOKEN: ${{ secrets[format('YT_TOKEN_JSON{0}', matrix.sir)] }}
          # buffer modu (docs/arastirma/06): Buffer API + otomat-site deploy key (medya geçici olarak Pages'ta)
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          OTOMAT_SITE_ANAHTAR: ${{ secrets.OTOMAT_SITE_ANAHTAR }}
          # hikâye motoru (K-16): senaryo, sahne görselleri, kare denetimi ve çeviri Cloudflare Workers AI bedava kotasıyla
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          export "YT_TOKEN_JSON${{ matrix.sir }}=$KANAL_TOKEN"
          uv run python -m otomat.gunluk
      # yalnız bu koşunun üretimleri: yayından önce/sonra inceleme (video, sahneler, meta, altyazı) ve sonraki
      # koşunun hazır/yarım üretimi (senaryo, çeviri). 4 gün: pist 3 gün; 7 günde depo 360 MB'a çıkmıştı (10-13).
      # Ad deneme numarasını taşır: "Re-run" aynı adla yüklemeye çalışıp düşüyordu.
      - name: Üretim klasörü (inceleme)
        if: always() && hashFiles('calisma/gunluk/**/meta.json', 'calisma/gunluk/**/senaryo.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: uretim-${{ matrix.kanal }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            calisma/gunluk/**/video.mp4
            calisma/gunluk/**/sahne_*.jpg
            calisma/gunluk/**/meta.json
            calisma/gunluk/**/senaryo.json
            calisma/gunluk/**/yerel.json
            calisma/gunluk/**/*.srt
          retention-days: 4
      - name: Teslim paketi (Plan B) → haftanın Release'i
        if: always() && hashFiles('teslim/**') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ matrix.etiket }}-$(date -u +%G-H%V)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Teslim ${{ matrix.kanal }} $(date -u +%G) / hafta $(date -u +%V)" \
            --notes "Plan B: bu haftanın videoları."
          gh release upload "$TAG" teslim/* --clobber
          # haftanın tüm YUKLE.md'lerinden tek sayfa: sıra, TR yayın saati, kopyala-yapıştır blokları
          mkdir -p hafta
          gh release download "$TAG" -p "*_YUKLE.md" -D hafta --clobber
          uv run python -m otomat.yayin.hafta hafta "$TAG" > HAFTA.md
          gh release upload "$TAG" HAFTA.md --clobber
          gh release edit "$TAG" --notes "Plan B: bu haftanın videoları. Yüklerken yalnız HAFTA.md'yi aç: sıra, yayın saati (TR) ve yapıştırılacak metinler orada."
      - name: Durumu kaydet
        if: always() && steps.kontrol.outputs.atla != '1'
        run: |
          git config user.name "otomat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add durum/ raporlar/
          git diff --cached --quiet || git commit -m "Günlük koşu ($OTOMAT_KANAL): durum ve rapor ($(date -u +%F))"
          # diğer kanalların işleri aynı dala yazıyor; dosyalar ayrı olduğu için rebase çakışmaz
          for i in 1 2 3 4 5; do git push && break; git pull --rebase; sleep $((i * 5)); done
          git push  # beş denemede de gitmediyse adım düşsün
      - name: Alarm (issue)
        if: always() && steps.kontrol.outputs.atla != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SONUC: ${{ job.status }}
          KOSU: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SONUC" != "success" ] && [ ! -f calisma/alarm.md ]; then
            mkdir -p calisma
            printf 'Günlük koşu %s: iş adımı düştü (%s), Python alarm yazamadan.\n' "$(date -u +%F)" "$SONUC" > calisma/alarm.md
          fi
          gh label create alarm --color B60205 --description "Otomat günlük koşu alarmı" --force
          gh label create "kanal:$OTOMAT_KANAL" --color 1D76DB --description "Otomat kanalı" --force
          ACIK=$(gh issue list --label alarm --label "kanal:$OTOMAT_KANAL" --state open --json number --jq '.[0].number // empty')
          if [ -f calisma/alarm.md ]; then
            printf '\n[Koşu kaydı](%s) · @Scryne\n' "$KOSU" >> calisma/alarm.md
            if [ -n "$ACIK" ]; then gh issue comment "$ACIK" --body-file calisma/alarm.md
            else gh issue create --title "Otomat alarmı ($OTOMAT_KANAL)" --label alarm --label "kanal:$OTOMAT_KANAL" --body-file calisma/alarm.md; fi
          elif [ -n "$ACIK" ]; then
            gh issue close "$ACIK" --comment "Temiz koşu ($(date -u +%F)): alarm kapandı. $KOSU"
          fi

  # Faz 13: kanallar yan yana haftalık portföy raporu (raporlar/portfoy/). Kanal işleri haftalık raporlarını yazdıktan
  # sonra; yalnız günün ilk koşusunda ve elle (ayda ≤ 30 dk), yazılacak rapor yoksa ilk adımda biter.
  portfoy:
    needs: uret
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      # son 4 haftadan eksik portföy raporu (yalnız geçen hafta bakılıyordu; o hafta kaçınca sonsuza dek eksik kalıyordu)
      - name: Yazılacak rapor var mı
        id: kontrol
        run: |
          eksik=0
          for g in 7 14 21 28; do
            h=$(date -u -d "$g days ago" +%G-H%V)
            [[ "$h" < "2026-H41" ]] && continue  # portfoy.ILK_HAFTA öncesi rapor beklenmez
            [ -f "raporlar/portfoy/$h.md" ] || eksik=1
          done
          if [ "$eksik" = 0 ]; then echo "atla=1" >> "$GITHUB_OUTPUT"; fi
      - uses: astral-sh/setup-uv@v7
        if: steps.kontrol.outputs.atla != '1'
        with:
          enable-cache: true
      - name: Portföy raporu
        if: steps.kontrol.outputs.atla != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python -m otomat.portfoy
      - name: Kaydet
        if: steps.kontrol.outputs.atla != '1'
        run: |
          git config user.name "otomat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d raporlar/portfoy ] || exit 0  # rapor yazılmadı (ILK_HAFTA öncesi ya da kanal raporları eksik)
          git add raporlar/portfoy/
          git diff --cached --quiet && exit 0
          git commit -m "Portföy raporu"
          for i in 1 2 3 4 5; do git push && break; git pull --rebase; sleep $((i * 5)); done
          git push
