name: Günlük üretim

# Her gün bir video: analitik → veri → haydut seçimi → anlatım (kapılar) → ses → görsel → çeviri → yayın (api) ya da
# teslim paketi (Plan B). Pazartesi geçen haftanın raporu. Sorun olursa "alarm" etiketli issue (Scryne'a bildirim).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: gunluk
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OTOMAT_YAYIN: ${{ vars.OTOMAT_YAYIN || 'teslim' }}
      YT_ISTEMCI_JSON: ${{ secrets.YT_ISTEMCI_JSON }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --extra ses
      - name: Model önbelleği
        uses: actions/cache@v6
        with:
          path: |
            ~/.ollama/models
            modeller
          key: modeller-${{ hashFiles('config/modeller.toml') }}
      - name: Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          sleep 5
          ollama pull "$(grep -m1 '^model' config/modeller.toml | cut -d'"' -f2)"
      - name: Üret
        id: uret
        run: uv run python -m otomat.gunluk
      - name: Teslim paketi (Plan B) → haftanın Release'i
        if: hashFiles('teslim/**') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="teslim-$(date -u +%G-H%V)"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Teslim $(date -u +%G) / hafta $(date -u +%V)" \
            --notes "Plan B: bu haftanın videoları."
          gh release upload "$TAG" teslim/* --clobber
          # haftanın tüm YUKLE.md'lerinden tek sayfa: sıra, TR yayın saati, kopyala-yapıştır blokları
          mkdir -p hafta
          gh release download "$TAG" -p "*_YUKLE.md" -D hafta --clobber
          uv run python -m otomat.yayin.hafta hafta "$TAG" > HAFTA.md
          gh release upload "$TAG" HAFTA.md --clobber
          gh release edit "$TAG" --notes "Plan B: bu haftanın videoları. Yüklerken yalnız HAFTA.md'yi aç: sıra, yayın saati (TR) ve yapıştırılacak metinler orada."
      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "otomat-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add durum/ raporlar/
          git diff --cached --quiet || git commit -m "Günlük koşu: durum ve rapor ($(date -u +%F))"
          git push
      - name: Alarm (issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SONUC: ${{ job.status }}
          KOSU: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SONUC" != "success" ] && [ ! -f calisma/alarm.md ]; then
            mkdir -p calisma
            printf 'Günlük koşu %s: iş adımı düştü (%s), Python alarm yazamadan.\n' "$(date -u +%F)" "$SONUC" > calisma/alarm.md
          fi
          gh label create alarm --color B60205 --description "Otomat günlük koşu alarmı" --force
          ACIK=$(gh issue list --label alarm --state open --json number --jq '.[0].number // empty')
          if [ -f calisma/alarm.md ]; then
            printf '\n[Koşu kaydı](%s) · @Scryne\n' "$KOSU" >> calisma/alarm.md
            if [ -n "$ACIK" ]; then gh issue comment "$ACIK" --body-file calisma/alarm.md
            else gh issue create --title "Otomat alarmı" --label alarm --body-file calisma/alarm.md; fi
          elif [ -n "$ACIK" ]; then
            gh issue close "$ACIK" --comment "Temiz koşu ($(date -u +%F)): alarm kapandı. $KOSU"
          fi
