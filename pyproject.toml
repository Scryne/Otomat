[project]
name = "otomat"
version = "0.1.0"
description = "Sıfır sermayeli otomatik gelir botları — Shorts fabrikası v2"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "imageio-ffmpeg>=0.6",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
ses = ["kokoro-onnx>=0.4", "faster-whisper>=1.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spikes", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
