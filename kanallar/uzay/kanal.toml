# Orbit kanalı → çocuklar için Ezop masalları (2026-10-08, K-15…K-19; docs/arastirma/08). Made for kids (MFK):
# Scryne riskleri görüp seçti (yorum/kişiselleştirilmiş reklam kapalı, denetim sıkı). Kimlik `uzay` kalır (token
# secret'ı YT_TOKEN_JSON_UZAY, durum/uzay.db); `ad` YouTube'daki kanal adıyla birebir aynı olmalı.
id = "uzay"
ad = "Orbit Ruler"
tanim = "gentle illustrated fables for children aged 3 to 7, each with a simple lesson"
tur = "hikaye"
kaynaklar = ["ezop"]
veri = "kanallar/uzay/havuz.json"
tasarim = "kanallar/uzay/DESIGN.md"
durum = "durum/uzay.db"
raporlar = "raporlar/uzay"
ses = "af_heart"
hiz = 0.95
yayin_saati_utc = 20  # 23:00 TR; ABD öğleden sonrası (okul çıkışı). Earth'le aynı saat değil (K-11)
diller = ["es", "pt", "de", "fr"]
kategori = "1"  # Film & Animation
sir_eki = "_UZAY"  # YT_TOKEN_JSON_UZAY
buffer_kanal_id = "6ac549856a5c39ccb634a0b1"  # Buffer GraphQL kanal kimliği (2026-10-06)
mfk = true
ornekler = ""
kaliplar = ["karakter", "soru", "ses", "sorun"]
stil = """Soft children's picture book illustration, gouache and colored pencil, rounded friendly shapes, warm pastel
palette, cute animals with big kind eyes, cozy and gentle, full-bleed edge-to-edge artwork with no border or frame,
no text, no letters"""
font = "otomat/varliklar/fontlar/LuckiestGuy-Regular.ttf"
font_boyu = 100
vurgu = "#FFB703"
muzik_ses = 0.15

[muzik]  # Kevin MacLeod, incompetech.com, CC BY 4.0 (açıklamada atıf)
playful = ["Monkeys Spinning Monkeys", "Carefree", "Pippin the Hunchback", "Fluffing a Duck"]
gentle = ["Wholesome", "Fairytale Waltz", "Dreamer", "Floating Cities"]
