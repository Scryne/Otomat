# Earth kanalı → gerçek tuhaf hikâyeler (2026-10-08, K-15…K-19; docs/arastirma/08). Veri formatı izlenmedi (3-63 izlenme).
# Yollar çok kanal öncesi düzeni korur (durum/otomat.db, raporlar/): geçmiş ve analitik eşleşmesi bozulmaz.
# `ad` YouTube'daki kanal adıyla birebir aynı olmalı (youtube.kanal_dogrula); kanal yeniden adlandırılınca burası da değişir.
id = "earth"
ad = "Inkwell Oddities"
eski_adlar = ["Earth in Numbers"]  # Scryne Studio'da yeniden adlandırana kadar (Faz 15); sonra silinebilir
yedek_adlar = ["The Inkwell Oddities", "Inkwell Oddities Stories", "Inkwell Oddities TV"]  # YouTube `ad`ı reddederse (10-08: "Bu adı kullanamazsınız")
tanim = "illustrated short true stories: the strangest real events, people and animals from history"
tur = "hikaye"
bicim = "kart"  # K-25 (2026-10-14): anlatıcısız tek ekran paragraf + gerçek görsel; sahneli anlatım 3-81 izlenmede kaldı
kaynaklar = ["tuhaf"]
veri = "kanallar/earth/havuz.json"
tasarim = "kanallar/earth/DESIGN.md"
durum = "durum/otomat.db"
raporlar = "raporlar"
ses = "bm_george"
hiz = 1.08
yayin_saati_utc = 14  # 17:00 TR; ABD sabahı / Avrupa öğleden sonrası
diller = ["es", "pt", "de", "fr"]
kategori = "27"  # Education
sir_eki = ""  # YT_TOKEN_JSON
buffer_kanal_id = "6ac3c3346a5c39ccb620b6af"  # Buffer GraphQL kanal kimliği (2026-10-06)
mfk = false
donem = "2026-10-17"  # kart biçiminin (K-25) ilk public videosu (Hobby Lobby): haydut ödülleri ve K-14 sayacı 8 sn kartı
# 30 sn sahneli videolarla karıştırmasın (Orbit K-24 gibi). Sahneli dönem 10-10 – 10-16 raporlarda kıyas tabanı
ornekler = ""
kaliplar = ["sonuc_once", "detay", "zitlik", "kisi"]
stil = """Hand-drawn storybook illustration, confident ink lines, muted watercolor, warm paper texture, cinematic
composition, expressive faces, full-bleed edge-to-edge artwork with no border or frame, no text, no letters, no signs,
no captions"""
font = "otomat/varliklar/fontlar/BarlowCondensed-Bold.ttf"
font_boyu = 104
vurgu = "#FFD84D"
muzik_lufs = -30  # müzik yatağı (anlatıcı -14 LUFS, karışım ≈ -14)

[muzik]  # Kevin MacLeod, incompetech.com, CC BY 4.0 (açıklamada atıf)
mysterious = ["Investigations", "Curse of the Scarab", "Spellbound", "Darkling"]
tragic = ["Heartbreaking", "Lightless Dawn", "Gymnopedie No 1"]
epic = ["Volatile Reaction", "Sovereign"]
funny = ["Sneaky Snitch", "Fluffing a Duck", "Merry Go"]
